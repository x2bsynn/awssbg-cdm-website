
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Management | AWSSBG-CDM</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    .admin-content { width: min(1100px, 94%); margin: 32px auto; }
    .toolbar, .form-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .toolbar { justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .event-form, .events-panel { background: white; padding: 22px; border-radius: 12px; margin-bottom: 24px; box-shadow: 0 2px 12px #0000000d; }
    .event-form label { display: block; margin: 14px 0 6px; font-weight: 600; }
    .event-form input, .event-form select { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #ccc; border-radius: 6px; }
    .event-form button, .toolbar button, .event-actions button { padding: 9px 14px; border: 0; border-radius: 6px; cursor: pointer; }
    .primary { background: #146eb4; color: white; }
    .danger { background: #b42318; color: white; }
    .secondary { background: #e8edf2; color: #222; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #e5e7eb; }
    .event-actions { display: flex; gap: 6px; }
    .notice { margin: 12px 0; }
    .error { color: #b42318; }
    .success { color: #137333; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="admin-content">
    <div class="toolbar">
      <div>
        <h1>AWSSBG-CDM</h1>
        <p>Administrator Dashboard · Event Management</p>
      </div>
      <button id="logout-button" class="secondary" type="button">Sign out</button>
    </div>

    <p id="notice" class="notice" role="status" aria-live="polite">Checking your session...</p>

    <section id="event-management" hidden>
      <div class="toolbar">
        <h2>Events</h2>
        <button id="new-event-button" class="primary" type="button">+ New event</button>
      </div>

      <section id="event-form-panel" class="event-form" hidden>
        <h2 id="form-heading">Create event</h2>
        <form id="event-form">
          <input id="event-id" type="hidden">

          <label for="title">Event title</label>
          <input id="title" name="title" maxlength="200" required>

          <label for="date">Date</label>
          <input id="date" name="date" type="date" required>

          <label for="location">Location</label>
          <input id="location" name="location" maxlength="300" required>

          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
          </select>

          <div class="form-actions" style="margin-top:18px">
            <button class="primary" type="submit">Save event</button>
            <button id="cancel-button" class="secondary" type="button">Cancel</button>
          </div>
        </form>
      </section>

      <section class="events-panel">
        <div class="toolbar">
          <h2>Event list</h2>
          <button id="refresh-button" class="secondary" type="button">Refresh</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Date</th>
                <th>Location</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="events-body">
              <tr><td colspan="5">Loading events...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script type="module">
    import { userManager, signOut } from "./auth.js";

    const API_BASE =
      "https://xxbmakdu4d.execute-api.us-east-1.amazonaws.com/prod/admin/events";

    const $ = (id) => document.getElementById(id);
    const notice = $("notice");
    const formPanel = $("event-form-panel");
    const management = $("event-management");
    const eventsBody = $("events-body");

    let idToken = null;
    let events = [];

    function showNotice(message, type = "") {
      notice.textContent = message;
      notice.className = `notice ${type}`;
    }

    async function apiRequest(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          Authorization: idToken,
          ...(options.body ? { "Content-Type": "application/json" } : {}),
          ...options.headers
        }
      });

      const text = await response.text();
      let data;
      try { data = text ? JSON.parse(text) : null; }
      catch { data = text; }

      if (response.status === 401) {
        throw new Error("Your session is no longer authorized. Sign in again.");
      }
      if (!response.ok) {
        throw new Error(data?.message || `Request failed (${response.status})`);
      }
      return data;
    }

    function resetForm() {
      $("event-form").reset();
      $("event-id").value = "";
      $("form-heading").textContent = "Create event";
      formPanel.hidden = true;
    }

    function renderEvents() {
      eventsBody.replaceChildren();

      if (!events.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 5;
        cell.textContent = "No events found.";
        row.append(cell);
        eventsBody.append(row);
        return;
      }

      for (const event of events) {
        const row = document.createElement("tr");

        for (const value of [
          event.title, event.date, event.location, event.status
        ]) {
          const cell = document.createElement("td");
          cell.textContent = value ?? "";
          row.append(cell);
        }

        const actionsCell = document.createElement("td");
        const actions = document.createElement("div");
        actions.className = "event-actions";

        const edit = document.createElement("button");
        edit.className = "secondary";
        edit.textContent = "Edit";
        edit.addEventListener("click", () => {
          $("event-id").value = event.eventId;
          $("title").value = event.title ?? "";
          $("date").value = event.date ?? "";
          $("location").value = event.location ?? "";
          $("status").value = event.status ?? "draft";
          $("form-heading").textContent = "Edit event";
          formPanel.hidden = false;
          $("title").focus();
        });

        const remove = document.createElement("button");
        remove.className = "danger";
        remove.textContent = "Delete";
        remove.addEventListener("click", async () => {
          if (!confirm(`Delete "${event.title}"? This cannot be undone.`)) return;

          try {
            await apiRequest(`${API_BASE}/${encodeURIComponent(event.eventId)}`, {
              method: "DELETE"
            });
            showNotice("Event deleted.", "success");
            await loadEvents();
          } catch (error) {
            showNotice(error.message, "error");
          }
        });

        actions.append(edit, remove);
        actionsCell.append(actions);
        row.append(actionsCell);
        eventsBody.append(row);
      }
    }

    async function loadEvents() {
      eventsBody.replaceChildren();
      const row = document.createElement("tr");
      const cell = document.createElement("td");
      cell.colSpan = 5;
      cell.textContent = "Loading events...";
      row.append(cell);
      eventsBody.append(row);

      try {
        const data = await apiRequest(API_BASE);
        events = Array.isArray(data) ? data : data.events ?? [];
        renderEvents();
      } catch (error) {
        eventsBody.replaceChildren();
        const errorRow = document.createElement("tr");
        const errorCell = document.createElement("td");
        errorCell.colSpan = 5;
        errorCell.textContent = error.message;
        errorRow.append(errorCell);
        eventsBody.append(errorRow);
        showNotice(error.message, "error");
      }
    }

    $("new-event-button").addEventListener("click", () => {
      resetForm();
      formPanel.hidden = false;
      $("title").focus();
    });

    $("cancel-button").addEventListener("click", resetForm);
    $("refresh-button").addEventListener("click", loadEvents);

    $("event-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const eventId = $("event-id").value;
      const payload = {
        title: $("title").value.trim(),
        date: $("date").value,
        location: $("location").value.trim(),
        status: $("status").value
      };

      try {
        if (eventId) {
          await apiRequest(`${API_BASE}/${encodeURIComponent(eventId)}`, {
            method: "PUT",
            body: JSON.stringify(payload)
          });
          showNotice("Event updated.", "success");
        } else {
          await apiRequest(API_BASE, {
            method: "POST",
            body: JSON.stringify(payload)
          });
          showNotice("Event created.", "success");
        }

        resetForm();
        await loadEvents();
      } catch (error) {
        showNotice(error.message, "error");
      }
    });

    $("logout-button").addEventListener("click", async () => {
      try {
        await signOut();
      } catch (error) {
        showNotice(error.message, "error");
      }
    });

    try {
      const user = await userManager.getUser();

      if (!user || user.expired || !user.id_token) {
        window.location.replace("./");
      } else {
        idToken = user.id_token;
        management.hidden = false;
        showNotice("Signed in. Loading events...", "success");
        await loadEvents();
      }
    } catch (error) {
      console.error(error);
      showNotice("Unable to verify your session. Please sign in again.", "error");
    }
  </script>
</body>
</html>
