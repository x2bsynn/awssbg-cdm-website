<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | AWSSBG-CDM</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="login-container">
    <h1>AWSSBG-CDM</h1>
    <p>Administrator Dashboard</p>

    <p id="status">You are signed in with Cognito.</p>

    <section>
      <h2>Event Management</h2>
      <p>Event CRUD tools will be added after API authorization is configured.</p>
    </section>

    <button id="logout-button" type="button">Sign out</button>
  </main>

  <script type="module">
    import { userManager, signOut } from "./auth.js";

    const status = document.getElementById("status");

    try {
      const user = await userManager.getUser();

      if (!user || user.expired) {
        window.location.replace("./");
      }
    } catch (error) {
      console.error("Session check failed:", error);
      status.textContent = "Unable to verify your session. Please sign in again.";
    }

    document.getElementById("logout-button").addEventListener("click", async () => {
      try {
        await signOut();
      } catch (error) {
        console.error("Sign-out error:", error);
        status.textContent = "Unable to sign out. Please try again.";
      }
    });
  </script>
</body>
</html>
