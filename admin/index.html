<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffdf8">
  <title>Admin Login | AWSSBG-CDM</title>
  <link rel="icon" type="image/svg+xml" href="../assets/awssbg-cdm-logo.svg" />
  <link rel="stylesheet" href="./admin.css">
</head>

<body>
  <main class="login-container">
    <img class="login-logo" src="../assets/awssbg-cdm-logo.svg" alt="AWS Student Builder Group - Colegio de Muntinlupa">

    <h1>AWSSBG-CDM</h1>
    <p>Administration Portal</p>

    <div class="login-divider"></div>

    <p id="status" role="status" aria-live="polite">
      Sign in with your authorized administrator account.
    </p>

    <form id="login-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="admin@example.com" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
        placeholder="Enter your password" required>

      <p class="forgot-password-text">Forgot your password? <a href="#" id="forgot-password-link">Reset it here</a></p>

      <button id="login-button" type="submit">
        Sign in
      </button>
    </form>

    <section id="forgot-password-panel" hidden>
      <h2>Reset Your Password</h2>
      <p>Enter your registered email address to receive a verification code.</p>


      <!-- Request Verifcation Code -->

      <div id="recovery-request-action">
        <label for="recovery-email">Email address</label>

        <input id="recovery-email" type="email" autocomplete="email" placeholder="admin@example.com" required>

        <button id="send-recovery-code" type="button">Send Verification Code</button>
      </div>

      <!-- Confirm password reset -->

      <div id="recovery-confirm-section" hidden>

        <label for="recovery-code">Verification Code</label>

        <input id="recovery-code" type="text" autocomplete="one-time-code" placeholder="Enter verificatin code"
          required>

        <label for="recovery-new-password">New Password</label>
        <input id="recovery-new-password" type="password" autocomplete="new-password"
          placeholder="Enter your new password" required>

        <label for="recovery-confirm-password">Confirm New Password</label>
        <input id="recovery-confirm-password" type="password" autocomplete="new-password"
          placeholder="Confirm your new password" required>

        <button id="confirm-password-reset" type="button">Reset Password</button>
      </div>

      <button id="back-to-login" type="button">Back to Sign in</button>
    </section>

    <p class="login-security-note">
      Authorized administrators only. Authentication is secured
      by Amazon Cognito.
    </p>
  </main>



<script type="module">
  import {
    signIn,
    confirmSignIn,
    resetPassword,
    confirmResetPassword,
  } from "./amplify.js";

  // Login elements
  const form = document.getElementById("login-form");
  const loginButton = document.getElementById("login-button");
  const status = document.getElementById("status");

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  // Password recovery elements
  const forgotPasswordLink = document.getElementById("forgot-password-link");
  const recoveryPanel = document.getElementById("forgot-password-panel");
  const recoveryRequestSection = document.getElementById("recovery-request-section");
  const recoveryConfirmSection = document.getElementById("recovery-confirm-section");

  const recoveryEmail = document.getElementById("recovery-email");
  const recoveryCode = document.getElementById("recovery-code");
  const recoveryNewPassword = document.getElementById("recovery-new-password");
  const recoveryConfirmPassword = document.getElementById("recovery-confirm-password");

  const sendRecoveryCodeButton = document.getElementById("send-recovery-code");
  const confirmPasswordResetButton = document.getElementById("confirm-password-reset");
  const backToLoginButton = document.getElementById("back-to-login");

  let requiresNewPassword = false;

  // =========================================
  // TEMPORARY PASSWORD / FIRST-TIME LOGIN
  // =========================================

  function showNewPasswordField() {
    const passwordLabel = document.createElement("label");
    passwordLabel.htmlFor = "new-password";
    passwordLabel.textContent = "New Password";

    const passwordInput = document.createElement("input");
    passwordInput.id = "new-password";
    passwordInput.name = "new-password";
    passwordInput.type = "password";
    passwordInput.autocomplete = "new-password";
    passwordInput.placeholder = "Enter your new password";
    passwordInput.required = true;

    const confirmLabel = document.createElement("label");
    confirmLabel.htmlFor = "confirm-password";
    confirmLabel.textContent = "Confirm Password";

    const confirmInput = document.createElement("input");
    confirmInput.id = "confirm-password";
    confirmInput.name = "confirm-password";
    confirmInput.type = "password";
    confirmInput.autocomplete = "new-password";
    confirmInput.placeholder = "Confirm your new password";
    confirmInput.required = true;

    // Hide and disable the original login fields.
    emailInput.hidden = true;
    emailInput.disabled = true;
    emailInput.required = false;

    passwordInputElement.hidden = true;
    passwordInputElement.disabled = true;
    passwordInputElement.required = false;
    passwordInputElement.value = "";

    document.querySelector("label[for='email']").hidden = true;
    document.querySelector("label[for='password']").hidden = true;

    // Hide Forgot Password during the challenge.
    forgotPasswordLink.hidden = true;

    document.querySelector(".login-container h1").textContent =
      "Set Your New Password";

    // Insert the new password fields before the submit button.
    form.insertBefore(passwordLabel, loginButton);
    form.insertBefore(passwordInput, loginButton);
    form.insertBefore(confirmLabel, loginButton);
    form.insertBefore(confirmInput, loginButton);

    loginButton.textContent = "Set New Password";
    requiresNewPassword = true;

    status.textContent =
      "Your account requires a new password. Please set a new password to continue.";
  }

  // Preserve the original password input reference.
  const passwordInputElement = passwordInput;

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    loginButton.disabled = true;

    status.textContent = requiresNewPassword
      ? "Setting new password..."
      : "Signing in...";

    try {
      let result;

      if (requiresNewPassword) {
        const newPassword = document.getElementById("new-password").value;
        const confirmPassword = document.getElementById("confirm-password").value;

        if (!newPassword || !confirmPassword) {
          status.textContent = "Please complete both password fields.";
          return;
        }

        if (newPassword !== confirmPassword) {
          status.textContent = "Passwords do not match. Please try again.";
          return;
        }

        if (newPassword.length < 8) {
          status.textContent = "New password must be at least 8 characters long.";
          return;
        }

        result = await confirmSignIn({
          challengeResponse: newPassword,
        });

      } else {
        const email = emailInput.value.trim();
        const password = passwordInputElement.value;

        result = await signIn({
          username: email,
          password,
        });
      }

      if (result.isSignedIn) {
        status.textContent = "Sign-in successful. Opening dashboard...";
        window.location.assign("./dashboard/index.html");
        return;
      }

      const nextStep = result.nextStep?.signInStep;

      if (
        nextStep === "CONFIRM_SIGN_IN_WITH_NEW_PASSWORD_REQUIRED" &&
        !requiresNewPassword
      ) {
        showNewPasswordField();
        return;
      }

      console.info("Additional sign-in step:", nextStep);

      status.textContent =
        "Additional verification is required. Please contact an administrator for assistance.";

    } catch (error) {
      console.error("Sign-in failed:", error);

      status.textContent =
        error.message || "Unable to sign in. Check your credentials or contact an administrator.";

    } finally {
      loginButton.disabled = false;
    }
  });

  // =========================================
  // FORGOT PASSWORD
  // =========================================

  // Open password recovery.
  forgotPasswordLink.addEventListener("click", () => {
    recoveryEmail.value = emailInput.value.trim();

    form.hidden = true;
    recoveryPanel.hidden = false;

    recoveryRequestSection.hidden = false;
    recoveryConfirmSection.hidden = true;

    status.textContent =
      "Enter your registered email address to reset your password.";
  });

  // Request a verification code.
  sendRecoveryCodeButton.addEventListener("click", async () => {
    const username = recoveryEmail.value.trim();

    if (!username) {
      status.textContent = "Please enter your registered email address.";
      recoveryEmail.focus();
      return;
    }

    sendRecoveryCodeButton.disabled = true;
    status.textContent = "Sending verification code...";

    try {
      const result = await resetPassword({ username });
      const nextStep = result.nextStep?.resetPasswordStep;

      if (nextStep === "CONFIRM_RESET_PASSWORD_WITH_CODE") {
        recoveryRequestSection.hidden = true;
        recoveryConfirmSection.hidden = false;

        const destination =
          result.nextStep.codeDeliveryDetails?.destination;

        status.textContent = destination
          ? `A verification code has been sent to ${destination}.`
          : "A verification code has been sent using your registered recovery method.";

        recoveryCode.focus();

      } else if (nextStep === "DONE") {
        status.textContent =
          "Your password reset is already complete. Please sign in.";

        recoveryPanel.hidden = true;
        form.hidden = false;

      } else {
        status.textContent =
          "An additional password recovery step is required.";

        console.info("Password recovery step:", nextStep);
      }

    } catch (error) {
      console.error("Password recovery request failed:", error);

      status.textContent =
        error.message || "Unable to send the verification code. Please try again.";

    } finally {
      sendRecoveryCodeButton.disabled = false;
    }
  });

  // Confirm the password reset.
  confirmPasswordResetButton.addEventListener("click", async () => {
    const username = recoveryEmail.value.trim();
    const confirmationCode = recoveryCode.value.trim();
    const newPassword = recoveryNewPassword.value;
    const confirmPassword = recoveryConfirmPassword.value;

    if (!confirmationCode || !newPassword || !confirmPassword) {
      status.textContent = "Please complete all password reset fields.";
      return;
    }

    if (newPassword !== confirmPassword) {
      status.textContent = "Your passwords do not match.";
      recoveryConfirmPassword.focus();
      return;
    }

    confirmPasswordResetButton.disabled = true;
    status.textContent = "Resetting your password...";

    try {
      await confirmResetPassword({
        username,
        confirmationCode,
        newPassword,
      });

      status.textContent =
        "Your password has been reset successfully. You can now sign in.";

      recoveryPanel.hidden = true;
      form.hidden = false;

      emailInput.value = username;
      passwordInputElement.value = "";

      recoveryCode.value = "";
      recoveryNewPassword.value = "";
      recoveryConfirmPassword.value = "";

      emailInput.focus();

    } catch (error) {
      console.error("Password reset confirmation failed:", error);

      status.textContent =
        error.message || "Unable to reset your password. Check your verification code and password requirements.";

    } finally {
      confirmPasswordResetButton.disabled = false;
    }
  });

  // Return to login.
  backToLoginButton.addEventListener("click", () => {
    recoveryPanel.hidden = true;
    form.hidden = false;

    recoveryRequestSection.hidden = false;
    recoveryConfirmSection.hidden = true;

    recoveryCode.value = "";
    recoveryNewPassword.value = "";
    recoveryConfirmPassword.value = "";

    status.textContent =
      "Sign in with your authorized administrator account.";
  });
</script>

</body>

</html>
