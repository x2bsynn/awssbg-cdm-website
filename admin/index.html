<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffdf8">
  <title>Admin Login | AWSSBG-CDM</title>
  <link rel="stylesheet" href="./admin.css">
</head>

<body>

  <main class="login-container">
    <img class="login-logo" src="../assets/awssbg-cdm-logo.svg" alt="AWS Student Builder Group - Colegio de Muntinlupa">

    <h1>AWSSBG-CDM</h1>
    <p>Administration Portal</p>

    <div class="login-divider"></div>

    <p id="status">
      Sign in with your authorized administrator account.
    </p>

    <form id="login-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="admin@example.com" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
        placeholder="Enter your password" required>

      <button id="login-button" type="submit">
        Sign in
      </button>
    </form>

    <p class="login-security-note">
      Authorized administrators only. Authentication is <br> secured by Amazon Cognito.
    </p>
  </main>


  <script type="module">
    import { signIn } from "./amplify.js";

    const form = document.getElementById("login-form");
    const loginButton = document.getElementById("login-button");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      status.textContent = "Signing in...";
      loginButton.disabled = true;

      try {
        const result = await signIn({
          username: email,
          password,
        });

        if (result.isSignedIn) {
          status.textContent = "Sign-in successful. Opening dashboard...";
          window.location.assign("./dashboard/index.html");
        } else {
          status.textContent =
            "Additional verification is required to complete sign-in.";
          console.info("Additional sign-in step:", result.nextStep.signInStep);
        }
      } catch (error) {
        console.error("Sign-in failed:", error);
        status.textContent =
          "Unable to sign in. Check your credentials or contact an administrator.";
      } finally {
        loginButton.disabled = false;
      }
    });
  </script>
</body>

</html>
