    // STATUS MESSAGE
    // ==========================================

    function setStatus(message = "", type = "") {
      status.textContent = message;
      status.className = type ? `status-${type}` : "";
      status.hidden = !message;
    }

    // ==========================================
    // EXISTING SESSION CHECK
    // ==========================================
    // Amplify refreshes an expired access/ID token automatically when a valid
    // refresh token is available. Only a verified Cognito Admins-group member
    // is redirected to the dashboard. The dashboard repeats this check itself.
    async function redirectIfAdministratorSessionExists() {
      try {
        await getCurrentUser();
        const session = await fetchAuthSession();
        const idToken = session.tokens?.idToken;

        if (!idToken) {
          form.hidden = false;
          setStatus("Your session has expired. Please sign in again.", "info");
          return;
        }

        const groups = idToken.payload?.["cognito:groups"] ?? [];
        const isAdministrator =
          Array.isArray(groups) && groups.includes("Admins");

        if (isAdministrator) {
          setStatus("Administrator session verified. Opening dashboard...", "success");
          window.location.replace("/admin/dashboard/dashboard.html");
          return;
        }

        // A signed-in account without the Admins group must not enter the
        // administration portal. Clear its local Cognito session first.
        try {
          await signOut();
        } catch (signOutError) {
          console.error("Unable to clear non-admin session:", signOutError);
        }

        form.hidden = false;
        passwordInput.value = "";
        setStatus(
          "This account does not have administrator access. Please use an authorized admin account.",
          "error"
        );
      } catch (error) {
        // No session, expired refresh token, or an unavailable auth service:
        // leave the regular sign-in form available instead of trapping users.
        console.info("No reusable administrator session was found:", error);
        form.hidden = false;

        const accessDenied =
          new URLSearchParams(window.location.search).get("error") === "access-denied";

        if (accessDenied) {
          setStatus("Access denied. This account is not authorized to use the admin dashboard.", "error");
        } else {
          setStatus("");
        }
      }
    }

    // ==========================================
    // RECOVERY API HELPER
    // ==========================================

    async function recoveryRequest(endpoint, payload) {
      const response = await fetch(
        `${RECOVERY_API}/admin/recovery/${endpoint}`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        }
      );

      let result;

      try {
        result = await response.json();
      } catch {
        throw new Error("The server returned an invalid response.");
      }

      if (!response.ok) {
        const error = new Error(
          result.message || "The recovery request could not be completed."
        );
        error.code = result.code || "RECOVERY_REQUEST_FAILED";
        error.attemptsRemaining = Number.isInteger(result.attemptsRemaining)
          ? result.attemptsRemaining
          : Number.isInteger(result.remainingAttempts)
            ? result.remainingAttempts
            : null;
        error.remainingAttempts = error.attemptsRemaining;
        throw error;
      }

      return result;
    }

    // ==========================================
    // OTP COUNTDOWN
    // ==========================================

    function formatCountdown(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function stopOtpCountdown() {
      if (otpCountdownInterval) {
        clearInterval(otpCountdownInterval);
        otpCountdownInterval = null;
      }

      otpExpiresAt = null;
    }

    function updateOtpCountdown() {
      if (!otpExpiresAt) return;

      const remainingSeconds = Math.max(
        0,
        Math.ceil((otpExpiresAt - Date.now()) / 1000)
      );

      const time = formatCountdown(remainingSeconds);
      otpCountdown.textContent = remainingSeconds <= 0
        ? "Code expired"
        : `Code expires in ${time}`;
      otpProgressBar.style.width = `${(remainingSeconds / OTP_VALIDITY_SECONDS) * 100}%`;

      if (remainingSeconds <= 0) {
        stopOtpCountdown();
        resendCodeButton.textContent = "Send a new code";
        resendCodeButton.disabled = false;
        return;
      }

      otpCountdown.textContent = "Enter the code before the timer runs out.";
      resendCodeButton.textContent = `Resend available in ${time}`;
      resendCodeButton.disabled = true;
    }

    function startOtpCountdown(requestStartedAt = Date.now()) {
      stopOtpCountdown();
      // Start from the request time, not the response time. The Lambda creates
      // the challenge before SES finishes sending the email.
      otpExpiresAt = requestStartedAt + OTP_VALIDITY_SECONDS * 1000;
      otpCountdown.textContent = "Code expires in 05:00";
      otpProgressBar.style.width = "100%";
      resendCodeButton.disabled = true;
      updateOtpCountdown();
      otpCountdownInterval = setInterval(updateOtpCountdown, 1000);
    }

    function renderOtpAttempts(remaining = 5) {
      otpAttemptsRemaining = Math.max(0, Math.min(5, remaining));
      const used = 5 - otpAttemptsRemaining;
      otpAttemptCount.textContent = `${otpAttemptsRemaining} ${otpAttemptsRemaining === 1 ? "attempt" : "attempts"} left`;
      otpAttemptHelp.textContent = otpAttemptsRemaining === 0
        ? "This code is locked. Request a new code after it expires."
        : used === 0
          ? "Up to five verification attempts are allowed."
          : `${used} incorrect ${used === 1 ? "attempt" : "attempts"} used.`;

      otpLocked = otpAttemptsRemaining === 0;
      recoveryCode.disabled = otpLocked;
      continueButton.disabled = otpLocked;
      recoveryCodeSection.classList.toggle("otp-locked", otpLocked);
    }

    function lockOtpChallenge() {
      renderOtpAttempts(0);
      recoveryCode.value = "";
      setStatus("Too many incorrect codes. This verification code is now locked. You can request another code after the current code expires.", "error");
    }

    // ==========================================
    // RECOVERY STAGE MANAGEMENT
    // ==========================================

    function showRecoveryStage(stage) {
      recoveryStage = stage;

      form.hidden = true;
      recoveryPanel.hidden = false;

      recoveryRequestSection.hidden = stage !== "request";
      recoveryCodeSection.hidden = stage !== "code";
      recoveryPasswordSection.hidden = stage !== "password";

      pageHeading.textContent =
        stage === "request"
          ? "Reset Your Password"
          : stage === "code"
            ? "Verify Your Email"
            : "Set a New Password";

      divider.hidden = true;
      securityNote.hidden = true;

      description.textContent =
        stage === "request"
          ? "Enter your registered email address to receive a verification code."
          : stage === "code"
            ? "Enter the verification code sent to your registered email address."
            : "Choose a new password for your administrator account.";
    }

    // ==========================================
    // TEMPORARY PASSWORD CHALLENGE
    // ==========================================

    function showTemporaryPasswordChallenge() {
      const passwordLabel = document.createElement("label");
      passwordLabel.htmlFor = "new-password";
      passwordLabel.textContent = "New Password";

      const newPassword = document.createElement("input");
      newPassword.id = "new-password";
      newPassword.type = "password";
      newPassword.autocomplete = "new-password";
      newPassword.placeholder = "Enter your new password";
      newPassword.required = true;

      const confirmLabel = document.createElement("label");
      confirmLabel.htmlFor = "confirm-password";
      confirmLabel.textContent = "Confirm New Password";

      const confirmPassword = document.createElement("input");
      confirmPassword.id = "confirm-password";
      confirmPassword.type = "password";
      confirmPassword.autocomplete = "new-password";
      confirmPassword.placeholder = "Confirm your new password";
      confirmPassword.required = true;

      emailInput.hidden = true;
      emailInput.disabled = true;
      emailInput.required = false;

      passwordInput.hidden = true;
      passwordInput.disabled = true;
      passwordInput.required = false;
      passwordInput.value = "";

      form.querySelector('label[for="email"]').hidden = true;
      form.querySelector('label[for="password"]').hidden = true;

      forgotPasswordText.hidden = true;

      pageHeading.textContent = "Set Your New Password";
      divider.hidden = true;
      securityNote.hidden = true;

      form.insertBefore(passwordLabel, loginButton);
      form.insertBefore(newPassword, loginButton);
      form.insertBefore(confirmLabel, loginButton);
      form.insertBefore(confirmPassword, loginButton);

      loginButton.textContent = "Set New Password";

      requiresNewPassword = true;

      setStatus(
        "Your account requires a new password. Please set one to continue."
      );

      newPassword.focus();
    }

    // ==========================================
    // NORMAL COGNITO SIGN-IN
    // ==========================================

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      loginButton.disabled = true;

      setStatus(
        requiresNewPassword
          ? "Setting new password..."
          : "Signing in...",
        "loading"
      );

      try {
        let result;

        if (requiresNewPassword) {
          const newPassword =
            document.getElementById("new-password").value;

          const confirmPassword =
            document.getElementById("confirm-password").value;

          if (!newPassword || !confirmPassword) {
            throw new Error("Please complete both password fields.");
          }

          if (newPassword !== confirmPassword) {
            throw new Error("Passwords do not match.");
          }

          if (newPassword.length < 8) {
            throw new Error(
              "New password must be at least 8 characters long."
            );
          }

          result = await confirmSignIn({
            challengeResponse: newPassword
          });

        } else {
          result = await signIn({
            username: emailInput.value.trim(),
            password: passwordInput.value
          });
        }

        if (result.isSignedIn) {
          setStatus("Verifying administrator permissions...", "loading");

          try {
            const session = await fetchAuthSession();
            const idToken = session.tokens?.idToken;

            if (!idToken) {
              throw new Error("Unable to verify your account session. Please try again.");
            }

            const payload = idToken.payload ?? {};
            const groups = payload["cognito:groups"] ?? [];

            const isAdmin =
              Array.isArray(groups) && groups.includes("Admins");

            console.log("Authenticated account:", emailInput.value.trim());
            console.log("Cognito groups:", groups);

            if (!isAdmin) {
              console.warn("Access denied");

              try {
                await signOut();
              } catch (signOutError) {
                console.error("Unable to clear unauthorized session:", signOutError);
              }

              passwordInput.value = "";

              setStatus(
                "Access denied",
                "error"
              );

              return;
            }

            setStatus("Administrator verified. Opening dashboard...", "success");

            window.location.assign("./dashboard/dashboard.html");
            return;

          } catch (verificationError) {
            console.error("Administrator verification failed:", verificationError);

            try {
              await signOut();
            } catch (signOutError) {
              console.error("Unable to clear session:", signOutError);
            }

            setStatus(
              "We couldn't verify your administrator permissions. Please try again or contact an administrator.",
              "error"
            );

            return;
          }
        }

        if (
          result.nextStep?.signInStep ===
          "CONFIRM_SIGN_IN_WITH_NEW_PASSWORD_REQUIRED" &&
          !requiresNewPassword
        ) {
          showTemporaryPasswordChallenge();
          return;
        }

        setStatus(
          "Additional verification is required. Please contact an administrator for assistance."
        );

      } catch (error) {
        console.error("Sign-in failed:", error);

        setStatus(
          error.message ||
          "Unable to sign in. Please check your credentials.",
          "error"
        );

      } finally {
        loginButton.disabled = false;
      }
    });

    // ==========================================
    // OPEN PASSWORD RECOVERY
    // ==========================================

    forgotPasswordLink.addEventListener("click", (event) => {
      event.preventDefault();

      recoveryEmail.value = emailInput.value.trim();

      recoveryResetToken = null;

      showRecoveryStage("request");
      setStatus("");
    });

    // ==========================================
    // STEP 1: REQUEST OTP
    // ==========================================

    sendCodeButton.addEventListener("click", async () => {
      const email = recoveryEmail.value.trim();

      if (!email) {
        setStatus(
          "Please enter your registered email address.",
          "error"
        );

        recoveryEmail.focus();
        return;
      }

      if (!recoveryEmail.checkValidity()) {
        setStatus("Please enter a valid email address.", "error");
        recoveryEmail.focus();
        return;
      }

      sendCodeButton.disabled = true;
      const requestStartedAt = Date.now();

      setStatus("Sending verification code...", "loading");

      try {
        const result = await recoveryRequest("request", {
          email
        });

        recoveryResetToken = null;
        recoveryCode.value = "";

        showRecoveryStage("code");
        renderOtpAttempts(5);
        startOtpCountdown(requestStartedAt);

        setStatus(
          result.message ||
          "If the account is eligible, a verification code will be sent to its registered email address.",
          "success"
        );

        recoveryCode.focus();

      } catch (error) {
        console.error("Recovery request failed:", error);

        setStatus(
          error.message || "Unable to process your recovery request.",
          "error"
        );

      } finally {
        sendCodeButton.disabled = false;
      }
    });

    // ==========================================
    // RESEND OTP
    // ==========================================

    resendCodeButton.addEventListener("click", async () => {
      if (resendCodeButton.disabled) return;

      const email = recoveryEmail.value.trim();

      if (!email || !recoveryEmail.checkValidity()) {
        setStatus("Please return to the email step and enter a valid email address.", "error");
        return;
      }

      resendCodeButton.disabled = true;
      resendCodeButton.textContent = "Sending Code...";
      const requestStartedAt = Date.now();

      setStatus("Requesting a new verification code...", "loading");

      try {
        const result = await recoveryRequest("request", { email });

        recoveryCode.value = "";
        recoveryResetToken = null;
        renderOtpAttempts(5);
        startOtpCountdown(requestStartedAt);

        setStatus(
          result.message ||
          "If the account is eligible, a new recovery code will be sent to its registered email address.",
          "success"
        );

        recoveryCode.focus();
      } catch (error) {
        console.error("Resend recovery code failed:", error);

        // Keep resend available if the request failed.
        resendCodeButton.disabled = false;
        resendCodeButton.textContent = "Resend Code";

        setStatus(
          error.message || "Unable to request a new verification code. Please try again.",
          "error"
        );
      }
    });

    // ==========================================
    // OTP INPUT FORMATTING
    // ==========================================

    recoveryCode.addEventListener("input", () => {
      recoveryCode.value = recoveryCode.value
        .replace(/\D/g, "")
        .slice(0, 6);
    });

    // ==========================================
    // STEP 2: VERIFY OTP
    // ==========================================

    continueButton.addEventListener("click", async () => {
      const email = recoveryEmail.value.trim();
      const otp = recoveryCode.value.trim();

      if (!/^\d{6}$/.test(otp)) {
        setStatus(
          "Please enter the complete 6-digit verification code.",
          "error"
        );

        recoveryCode.focus();
        return;
      }

      continueButton.disabled = true;

      setStatus("Verifying your code...", "loading");

      try {
        const result = await recoveryRequest("verify", {
          email,
          otp
        });

        if (!result.resetToken) {
          throw new Error(
            "Verification succeeded, but no reset token was returned. Please request a new code."
          );
        }

        // Keep the token in memory only.
        recoveryResetToken = result.resetToken;
        stopOtpCountdown();

        showRecoveryStage("password");

        setStatus(
          "Your email has been verified. You can now set a new password.",
          "success"
        );

        recoveryNewPassword.focus();

      } catch (error) {
        console.error("OTP verification failed:", error);

        recoveryResetToken = null;

        const attemptsLeft = Number.isInteger(error.attemptsRemaining)
          ? error.attemptsRemaining
          : Number.isInteger(error.remainingAttempts)
            ? error.remainingAttempts
            : null;

        if (error.code === "ATTEMPTS_EXCEEDED" || attemptsLeft === 0) {
          lockOtpChallenge();
        } else {
          if (attemptsLeft !== null) {
            renderOtpAttempts(attemptsLeft);
          }
          setStatus(
            error.message || "That code is incorrect or expired. Check the code and try again.",
            "error"
          );
          if (!otpLocked) recoveryCode.focus();
        }

      } finally {
        // Do not re-enable verification after the backend reports lockout.
        continueButton.disabled = otpLocked;
      }
    });

    // ==========================================
    // STEP 3: COMPLETE PASSWORD RESET
    // ==========================================

    resetButton.addEventListener("click", async () => {
      const email = recoveryEmail.value.trim();

      const newPassword = recoveryNewPassword.value;
      const confirmPassword = recoveryConfirmPassword.value;

      if (!recoveryResetToken) {
        setStatus(
          "Your verification session has expired. Please request a new code.",
          "error"
        );

        recoveryResetToken = null;
        showRecoveryStage("request");
        return;
      }

      if (!newPassword || !confirmPassword) {
        setStatus("Please complete both password fields.", "error");
        return;
      }

      if (newPassword !== confirmPassword) {
        setStatus("Your passwords do not match.", "error");
        recoveryConfirmPassword.focus();
        return;
      }

      // Match the configured Cognito password policy.
      const passwordValid =
        newPassword.length >= 8 &&
        /[A-Z]/.test(newPassword) &&
        /[a-z]/.test(newPassword) &&
        /[0-9]/.test(newPassword) &&
        /[^A-Za-z0-9]/.test(newPassword);

      if (!passwordValid) {
        setStatus(
          "Password must contain at least 8 characters, including uppercase and lowercase letters, a number, and a special character.",
          "error"
        );

        recoveryNewPassword.focus();
        return;
      }

      resetButton.disabled = true;

      setStatus("Updating your password...", "loading");

      try {
        await recoveryRequest("complete", {
          email,
          resetToken: recoveryResetToken,
          newPassword
        });

        // Invalidate the token and stop the OTP countdown.
        recoveryResetToken = null;
        stopOtpCountdown();

        setStatus(
          "Your password has been reset successfully. You can now sign in.",
          "success"
        );

        recoveryPanel.hidden = true;
        form.hidden = false;

        pageHeading.textContent = "Sign in";
        description.textContent = "Access your administrator account.";

        divider.hidden = false;
        securityNote.hidden = false;
        forgotPasswordText.hidden = false;

        emailInput.disabled = false;
        emailInput.hidden = false;
        emailInput.required = true;

        passwordInput.disabled = false;
        passwordInput.hidden = false;
        passwordInput.required = true;

        form.querySelector('label[for="email"]').hidden = false;
        form.querySelector('label[for="password"]').hidden = false;

        emailInput.value = email;
        passwordInput.value = "";

        recoveryCode.value = "";
        recoveryNewPassword.value = "";
        recoveryConfirmPassword.value = "";

        passwordInput.focus();

      } catch (error) {
        console.error("Password reset failed:", error);

        setStatus(
          error.message ||
          "Unable to reset your password. The verification session may have expired.",
          "error"
        );

      } finally {
        resetButton.disabled = false;
      }
    });

    // ==========================================
    // BACK TO SIGN-IN
    // ==========================================

    backButton.addEventListener("click", () => {
      stopOtpCountdown();
      renderOtpAttempts(5);
      recoveryCode.disabled = false;
      recoveryResetToken = null;
      stopOtpCountdown();

      recoveryPanel.hidden = true;
      form.hidden = false;

      recoveryStage = "request";

      recoveryRequestSection.hidden = true;
      recoveryCodeSection.hidden = true;
      recoveryPasswordSection.hidden = true;

      pageHeading.textContent = "Sign in";
      description.textContent = "Access your administrator account.";

      divider.hidden = false;
      securityNote.hidden = false;
      forgotPasswordText.hidden = false;

      recoveryEmail.value = "";
      recoveryCode.value = "";
      recoveryNewPassword.value = "";
      recoveryConfirmPassword.value = "";

      setStatus("");
    });

    // Run only after the page controls and event handlers are ready.
    await redirectIfAdministratorSessionExists();
  </script>

</body>
